name: Build macOS app and DMG
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  mac-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_P12_B64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
      APPLE_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Install Developer ID certificate (optional)
        if: env.APPLE_P12_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLE_P12_PASSWORD" && test -n "$APPLE_SIGNING_IDENTITY"
          echo "$APPLE_P12_B64" | base64 --decode > "$RUNNER_TEMP/developer.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"
          KEYCHAIN="$RUNNER_TEMP/skysynoptic-build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 18000 "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer.p12" -k "$KEYCHAIN" -P "$APPLE_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
      - name: Build + smoke test + package
        run: bash scripts/build_macos.sh
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: SkySynoptic-${{ matrix.arch }}-macOS
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
